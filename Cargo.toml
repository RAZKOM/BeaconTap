[package]
name = "beacontap"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Per-process network monitor for Windows. Follows a process tree and shows what it talks to."
repository = "https://github.com/razkom/beacontap"
publish = false

[lib]
name = "beacontap"
path = "src/lib.rs"

[[bin]]
name = "beacontap"
path = "src/main.rs"

[dependencies]
# ETW consumer: session control, TDH schema parsing, callbacks. Fork of ferrisetw with windows 0.62 and bug fixes.
ferrisetw2 = { version = "=2.0.0", features = ["time_rs"] }
# Win32: Toolhelp, process times/command lines, tokens, process creation, shell icons, ShellExecute, IP Helper
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Export and settings
serde = { version = "1", features = ["derive", "rc"] }
# Errors
thiserror = "2"
anyhow = "1"
# Logging
log = "0.4"

[features]
default = ["quic-sni"]
# Name UDP flows from the TLS ClientHello inside QUIC Initial packets.
quic-sni = []

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
