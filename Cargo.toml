[package]
name = "beacontap"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Per-process network monitor for Windows. Follows a process tree and shows what it talks to."
repository = "https://github.com/razkom/beacontap"
publish = false

[lib]
name = "beacontap"
path = "src/lib.rs"

[[bin]]
name = "beacontap"
path = "src/main.rs"

[dependencies]
# GUI
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
# ETW consumer: session control, TDH schema parsing, callbacks. Fork of ferrisetw with windows 0.62 and bug fixes.
ferrisetw2 = { version = "=2.0.0", features = ["time_rs"] }
# Win32: Toolhelp, process times/command lines, tokens, process creation, shell icons, ShellExecute, IP Helper
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Export and settings
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Errors
thiserror = "2"
anyhow = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# Native file dialogs
rfd = { version = "0.17", default-features = false }
# Timestamps from ferrisetw2
time = { version = "0.3", features = ["local-offset"] }
# Packet layer: Ethernet/IPv4/IPv6/TCP/UDP header slicing (lax mode tolerates truncated frames)
etherparse = "0.21.0"
# QUIC server names: the client Initial packet is encrypted with keys derived from public data
# (RFC 9001 section 5.2). HKDF-SHA256 for the keys, AES-128-GCM for the payload, AES-ECB for
# header protection. RustCrypto, pure Rust, no build scripts. The 0.10/0.8/0.12 lines share one
# `digest`/`cipher` stack; the newer majors are an API migration with nothing we need.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"], optional = true }
aes = { version = "0.8.4", optional = true }
hkdf = { version = "0.12.4", optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[features]
default = ["quic-sni"]
# Name UDP flows from the TLS ClientHello inside QUIC Initial packets.
quic-sni = ["dep:aes-gcm", "dep:aes", "dep:hkdf", "dep:sha2"]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
